<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    WPS Office Font Rendering Improvements
    Inspired by OnlyOffice's font substitution approach:
    - Metric-compatible font aliases for MS Office fonts
    - Proper hinting and antialiasing for Korean/English mixed text
    - Fallback chains for missing fonts
  -->

  <!-- Match WPS Office application -->
  <match target="pattern">
    <test name="prgname" compare="contains">
      <string>wps</string>
    </test>
    <test name="prgname" compare="contains">
      <string>et</string>
    </test>
    <test name="prgname" compare="contains">
      <string>wpp</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- MS Office font aliases (metric-compatible substitutions) -->
  <!-- OnlyOffice uses Liberation fonts as metric-compatible replacements -->
  <alias>
    <family>Arial</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Times New Roman</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>Courier New</family>
    <prefer>
      <family>Liberation Mono</family>
      <family>Noto Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Cambria</family>
    <prefer>
      <family>Caladea</family>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>Consolas</family>
    <prefer>
      <family>Liberation Mono</family>
      <family>Noto Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Korean font fallbacks -->
  <alias>
    <family>Noto Sans CJK KR</family>
    <prefer>
      <family>Noto Sans CJK KR</family>
      <family>NanumGothic</family>
      <family>NanumBarunGothic</family>
      <family>Apple SD Gothic Neo</family>
      <family>Malgun Gothic</family>
    </prefer>
  </alias>

  <alias>
    <family>Noto Serif CJK KR</family>
    <prefer>
      <family>Noto Serif CJK KR</family>
      <family>NanumMyeongjo</family>
      <family>NanumBarunMyeongjo</family>
      <family>Apple Myungjo</family>
      <family>Batang</family>
    </prefer>
  </alias>

  <!-- WPS Office specific font families -->
  <alias>
    <family>WPS Office Symbol</family>
    <prefer>
      <family>WPS Office Symbol</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Emoji and symbol support -->
  <alias>
    <family>Segoe UI Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Twemoji Mozilla</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <!-- Improve rendering for small Korean text -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <test name="pixelsize" compare="less_eq">
      <double>16</double>
    </test>
    <edit name="hintstyle" mode="assign"><const>hintmedium</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Enable subpixel rendering for RGB displays -->
  <match target="font">
    <test name="rgba" compare="not_eq">
      <const>unknown</const>
    </test>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>

  <!-- Disable bitmap fonts for cleaner rendering -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="scalable"><bool>false</bool></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

</fontconfig>