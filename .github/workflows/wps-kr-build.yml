name: WPS Office KR Build & Release

on:
  schedule:
    - cron: '0 19 * * *'  # 매일 새벽 4시 KST (19:00 UTC) - klangkokr 자정 업데이트 이후
  push:
    paths:
      - 'translation_dict.json'
      - 'wps_한글_패치/**'
      - 'klangkokr/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if version unchanged'
        type: boolean
        default: false
      version:
        description: 'Specific version to build (e.g., 12.1.2.28080)'
        type: string
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-version:
    name: Check Upstream Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      build: ${{ steps.get_version.outputs.build }}
      sha256: ${{ steps.get_version.outputs.sha256 }}
      changed: ${{ steps.get_version.outputs.changed }}
      deb_url: ${{ steps.get_version.outputs.deb_url }}
      translation_updated: ${{ steps.check_translation.outputs.updated }}
    env:
      FORCE_BUILD: ${{ github.event.inputs.force_build }}
      FORCE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Get latest WPS Office version
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/get_version.py << 'PYEOF'
          import requests
          import re
          import json
          import os
          import subprocess

          # Get current version from PKGBUILD
          with open('PKGBUILD', 'r') as f:
              pkgbuild = f.read()
          
          current_version = re.search(r'pkgver=([\d.]+)', pkgbuild)
          current_version = current_version.group(1) if current_version else '0'
          print(f"Current PKGBUILD version: {current_version}")

          # Try multiple sources for latest version (ordered by reliability)
          latest_version = None
          latest_build = None
          
          # Source 1: linux.wps.cn (official Chinese site)
          try:
              print("Trying linux.wps.cn...")
              response = requests.get("https://linux.wps.cn/", timeout=15)
              versions = re.findall(r'12\.1\.\d+\.\d+', response.text)
              if versions:
                  latest_version = versions[0]
                  latest_build = latest_version.split('.')[-1]
                  print(f"Found version from linux.wps.cn: {latest_version}")
          except Exception as e:
              print(f"linux.wps.cn failed: {e}")

          # Source 2: AUR wps-office-cn
          if not latest_version:
              try:
                  print("Trying AUR wps-office-cn...")
                  response = requests.get(
                      'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=wps-office-cn',
                      timeout=15
                  )
                  match = re.search(r'pkgver=([\d.]+)', response.text)
                  if match:
                      latest_version = match.group(1)
                      latest_build = latest_version.split('.')[-1]
                      print(f"Found version from AUR wps-office-cn: {latest_version}")
              except Exception as e:
                  print(f"AUR wps-office-cn failed: {e}")

          # Source 3: AUR wps-office-365
          if not latest_version:
              try:
                  print("Trying AUR wps-office-365...")
                  response = requests.get(
                      'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=wps-office-365',
                      timeout=15
                  )
                  match = re.search(r'pkgver=([\d.]+)', response.text)
                  if match:
                      latest_version = match.group(1)
                      latest_build = latest_version.split('.')[-1]
                      print(f"Found version from AUR wps-office-365: {latest_version}")
              except Exception as e:
                  print(f"AUR wps-office-365 failed: {e}")

          # Source 4: www.wps.com/office/linux/
          if not latest_version:
              try:
                  print("Trying www.wps.com...")
                  response = requests.get("https://www.wps.com/office/linux/", timeout=15)
                  versions = re.findall(r'12\.1\.\d+\.\d+', response.text)
                  if versions:
                      latest_version = versions[0]
                      latest_build = latest_version.split('.')[-1]
                      print(f"Found version from www.wps.com: {latest_version}")
              except Exception as e:
                  print(f"www.wps.com failed: {e}")

          # If all sources failed
          if not latest_version:
              print("All version sources failed!")
              if os.environ.get('FORCE_VERSION'):
                  latest_version = os.environ['FORCE_VERSION']
                  latest_build = latest_version.split('.')[-1]
                  print(f"Using FORCE_VERSION: {latest_version}")
              else:
                  latest_version = current_version
                  latest_build = current_version.split('.')[-1]
                  print(f"No version change detected, keeping current: {latest_version}")

          print(f"Final determined version: {latest_version} (build: {latest_build})")

          # Check if version changed
          force_build = os.environ.get('FORCE_BUILD', 'false').lower() == 'true'
          changed = latest_version != current_version or force_build
          
          if changed:
              print(f"Version changed: {current_version} -> {latest_version}")
          else:
              print("No version change detected")

          # Construct deb URL
          deb_url = f"https://pubwps-wps365-obs.wpscdn.cn/download/Linux/{latest_build}/wps-office_{latest_version}.AK.preread.sw.365_765469_amd64.deb"
          
          # Try to get SHA256 (optional, we'll compute during build)
          sha256 = "SKIP"
          
          # Set outputs
          outputs = {
              'version': latest_version,
              'build': latest_build,
              'changed': str(changed).lower(),
              'deb_url': deb_url,
              'sha256': sha256
          }
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in outputs.items():
                  f.write(f"{k}={v}\n")
          PYEOF
          
          python3 /tmp/get_version.py

      - name: Check translation update
        id: check_translation
        run: |
          # Check if translation dict or wps_한글_패치 changed in last 24h or since last tag
          echo "Checking translation update..."
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            CHANGED_FILES=$(git diff --name-only "$LAST_TAG"..HEAD 2>/dev/null | grep -E "translation_dict|wps_한글_패치|klangkokr" | head -n 20 || true)
            echo "Changed files since $LAST_TAG: $CHANGED_FILES"
            if [[ -n "$CHANGED_FILES" ]]; then
              echo "updated=true" >> $GITHUB_OUTPUT
              echo "Translation updated since last tag"
              exit 0
            fi
          fi
          # Also check recent commits (last 24h) for translation changes
          RECENT=$(git log --since="24 hours ago" --name-only --pretty=format: 2>/dev/null | grep -E "translation_dict|wps_한글_패치|klangkokr" | head -n 5 || true)
          if [[ -n "$RECENT" ]]; then
            echo "Recent translation changes: $RECENT"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No recent translation update"
          fi

  build:
    name: Build Package
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || needs.check-version.outputs.translation_updated == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            libarchive \
            xz \
            tar \
            gzip \
            fakeroot \
            binutils \
            fontconfig \
            libxrender \
            xdg-utils \
            glu \
            libpulse \
            libxss \
            sqlite \
            libtool \
            libtiff \
            libxslt \
            libjpeg-turbo \
            libpng \
            freetype2 \
            desktop-file-utils \
            shared-mime-info \
            hicolor-icon-theme \
            sdl2 \
            libglvnd \
            ca-certificates \
            wget \
            python3 \
            python-pip \
            jq \
            curl \
            qt5-tools \
            ruby \
            rpm-tools

      - name: Checkout repository inside container
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup build user
        run: |
          useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Install ArgosTranslate model (force)
        run: |
          echo "=== Installing ArgosTranslate (force) ==="
          pip install --break-system-packages --no-cache-dir argostranslate 2>&1 | tail -n 20 || pip install --no-cache-dir argostranslate 2>&1 | tail -n 20 || true
          sudo -u builder pip install --break-system-packages --no-cache-dir argostranslate 2>&1 | tail -n 20 || sudo -u builder pip install --no-cache-dir argostranslate 2>&1 | tail -n 20 || true
          echo "--- Downloading en->ko model for root ---"
          cat > /tmp/install_ko_root.py << 'PYEOF'
          import argostranslate.package
          argostranslate.package.update_package_index()
          pkgs=[p for p in argostranslate.package.get_available_packages() if p.from_code=='en' and p.to_code=='ko']
          print(f'Root: Available {len(pkgs)}')
          for p in pkgs[:2]:
              print(p)
          if pkgs:
              dl_path = pkgs[0].download()
              # download() may return path or set attribute
              dl = getattr(pkgs[0], 'path', dl_path) or dl_path or getattr(pkgs[0], 'download_path', None)
              print(f'Root downloaded: {dl}')
              if dl:
                  argostranslate.package.install_from_path(dl)
                  print('Root model installed')
              else:
                  print('Root: download returned no path')
          else:
              print('Root: no pkg')
          PYEOF
          python3 /tmp/install_ko_root.py 2>&1 | tail -n 30 || echo "Root model install failed (non-fatal)"
          echo "--- Downloading en->ko model for builder ---"
          cat > /tmp/install_ko_builder.py << 'PYEOF'
          import argostranslate.package
          argostranslate.package.update_package_index()
          pkgs=[p for p in argostranslate.package.get_available_packages() if p.from_code=='en' and p.to_code=='ko']
          print(f'Builder: Available {len(pkgs)}')
          for p in pkgs[:2]:
              print(p)
          if pkgs:
              dl_path = pkgs[0].download()
              dl = getattr(pkgs[0], 'path', dl_path) or dl_path or getattr(pkgs[0], 'download_path', None)
              print(f'Builder downloaded: {dl}')
              if dl:
                  argostranslate.package.install_from_path(dl)
                  print('Builder model installed')
              else:
                  print('Builder: download returned no path')
          else:
              print('Builder: no pkg')
          PYEOF
          sudo -u builder python3 /tmp/install_ko_builder.py 2>&1 | tail -n 30 || echo "Builder model install failed (non-fatal)"
          echo "--- Verifying model ---"
          python3 -c "import argostranslate.translate; langs=argostranslate.translate.get_installed_languages(); print([l.code for l in langs])" 2>&1 | tail -n 20 || true
          sudo -u builder python3 -c "import argostranslate.translate; langs=argostranslate.translate.get_installed_languages(); print('Builder:', [l.code for l in langs])" 2>&1 | tail -n 20 || true

      - name: Prepare PKGBUILD with new version
        id: prepare_pkgbuild
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BUILD="${{ needs.check-version.outputs.build }}"
          DEB_URL="${{ needs.check-version.outputs.deb_url }}"
          
          # Update PKGBUILD - CN base uses _get_source_url, so only pkgver
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          # For CN base, source is generated via _get_source_url, no source_base to update
          # Keep DEB_URL for verification but PKGBUILD will download via makepkg
          
          # Show changes
          git diff PKGBUILD

      - name: Download and verify source
        id: download_source
        run: |
          # CN base: source URL is time-signed via _get_source_url, so we generate it here
          VERSION="${{ needs.check-version.outputs.version }}"
          # Generate CN URL via same logic as PKGBUILD _get_source_url
          furl="https://wps-linux-personal.wpscdn.cn/wps/download/ep/Linux2023/${VERSION##*.}/wps-office_${VERSION}.AK.preread.sw.Personal_765474_amd64.deb"
          uri="${furl#https://wps-linux-personal.wpscdn.cn}"
          secrityKey='7f8faaaa468174dc1c9cd62e5f218a5b'
          timestamp10=$(date '+%s')
          md5hash=$(echo -n "${secrityKey}${uri}${timestamp10}" | md5sum)
          DEB_URL="${furl}?t=${timestamp10}&k=${md5hash%% *}"
          echo "Generated CN DEB_URL: $DEB_URL"
          DEB_FILE="wps-office_${VERSION}_amd64.deb"
          
          echo "Downloading: $DEB_URL"
          wget -q --show-progress "$DEB_URL" -O "$DEB_FILE" || {
            echo "CN download failed, trying fallback 365 URL: ${{ needs.check-version.outputs.deb_url }}"
            DEB_URL="${{ needs.check-version.outputs.deb_url }}"
            DEB_FILE=$(basename "$DEB_URL" | cut -d'?' -f1)
            wget -q --show-progress "$DEB_URL" -O "$DEB_FILE"
          }
          
          # Compute SHA256
          SHA256=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)
          echo "Computed SHA256: $SHA256"
          
          # Update PKGBUILD with correct SHA256
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA256}')/" PKGBUILD
          
          # Save SHA256 for later
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          
          # Keep deb in workspace root for PKGBUILD prepare() and also ensure src exists for makepkg
          mv "$DEB_FILE" wps-office_${VERSION}_amd64.deb 2>/dev/null || true
          mkdir -p src
          cp -a wps-office_${VERSION}_amd64.deb src/ 2>/dev/null || true
          ls -lh wps-office_*.deb src/*.deb 2>&1 | head

      - name: Build package
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/src"
          chown -R builder:builder "${GITHUB_WORKSPACE}/src" "${GITHUB_WORKSPACE}/PKGBUILD" 2>/dev/null || chown -R builder:builder "${GITHUB_WORKSPACE}" 2>/dev/null || true
          sudo -u builder bash -c "
            cd \"${GITHUB_WORKSPACE}\"
            makepkg -s --noconfirm 2>&1 | tee build.log
          "

      - name: Build deb and rpm packages (x64/amd64)
        run: |
          echo "=== Building deb and rpm via fpm (x64/amd64) ==="
          gem install --no-document fpm 2>&1 | tail -n 10
          gem env 2>&1 | head -n 30
          echo "--- locating fpm ---"
          find / -name "fpm" -type f 2>/dev/null | head -n 20 || true
          FPM_BIN="$(find / -name "fpm" -type f 2>/dev/null | head -1)"
          if [[ -z "$FPM_BIN" ]]; then
            GEM_BIN="$(ruby -r rubygems -e 'puts Gem.bindir' 2>/dev/null || echo /usr/local/bin)"
            echo "fallback GEM_BIN=$GEM_BIN"
            FPM_BIN="$GEM_BIN/fpm"
          fi
          if [[ ! -x "$FPM_BIN" ]]; then
            FPM_BIN="$(which fpm 2>/dev/null || echo "")"
          fi
          echo "FPM_BIN=$FPM_BIN"
          ls -l "$FPM_BIN" 2>&1 | head || true
          "$FPM_BIN" --version 2>&1 | head || fpm --version 2>&1 | head || true
          if [[ -z "$FPM_BIN" || ! -x "$FPM_BIN" ]]; then
            echo "fpm not found after install, trying gem exec"
            FPM_BIN="gem exec fpm"
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          # Extract arch package to stage dir for fpm
          mkdir -p /tmp/fpm_stage
          # Use the main package's pkg.tar.zst as source
          MAIN_PKG=$(ls wps-office-kr-${VERSION}-1-x86_64.pkg.tar.zst 2>/dev/null | head -1)
          if [[ -f "$MAIN_PKG" ]]; then
            echo "Using $MAIN_PKG as source for deb/rpm"
            tar -xf "$MAIN_PKG" -C /tmp/fpm_stage 2>&1 | head -n 20 || bsdtar -xf "$MAIN_PKG" -C /tmp/fpm_stage 2>&1 | head -n 20 || true
            ls -lh /tmp/fpm_stage/usr/lib/office6/mui/ko_KR 2>&1 | head -n 20 || true
            # Build deb (amd64)
            "$FPM_BIN" -s dir -t deb -n wps-office-kr -v "${VERSION}" --architecture amd64 \
              --description "WPS Office with Korean locale (CN base, /usr/lib/office6) - deb" \
              --url "https://github.com/${{ github.repository }}" --maintainer "WPS Office KR" \
              --depends fontconfig --depends libxrender --depends xdg-utils \
              -C /tmp/fpm_stage usr/lib usr/bin usr/share etc 2>&1 | tail -n 20 || echo "fpm deb failed"
            # Build rpm (x86_64 / x64)
            "$FPM_BIN" -s dir -t rpm -n wps-office-kr -v "${VERSION}" --architecture x86_64 \
              --description "WPS Office with Korean locale (CN base) - rpm" \
              --url "https://github.com/${{ github.repository }}" --maintainer "WPS Office KR" \
              --depends fontconfig --depends libXrender \
              -C /tmp/fpm_stage usr/lib usr/bin usr/share etc 2>&1 | tail -n 20 || echo "fpm rpm failed"
            ls -lh *.deb *.rpm 2>&1 | head -n 20
          else
            echo "Main Arch package not found, skipping deb/rpm"
          fi

      - name: Verify packages
        run: |
          ls -lh *.pkg.tar.zst *.deb *.rpm 2>&1 | head -n 30
          
          # Check package contents
          for pkg in *.pkg.tar.zst; do
            echo "=== $pkg ==="
            tar -tf "$pkg" | head -20
          done
          for pkg in *.deb; do
            [[ -f "$pkg" ]] || continue
            echo "=== $pkg (deb) ==="
            ar t "$pkg" 2>&1 | head -n 10
            dpkg -c "$pkg" 2>&1 | head -n 20 || tar -tf "$pkg" 2>&1 | head -n 20
          done
          for pkg in *.rpm; do
            [[ -f "$pkg" ]] || continue
            echo "=== $pkg (rpm) ==="
            rpm -qip "$pkg" 2>&1 | head -n 20 || tar -tf "$pkg" 2>&1 | head -n 20
          done

      - name: Generate package info
        id: package_info
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          SHA256="${{ steps.download_source.outputs.sha256 }}"
          
          # Create release notes
          cat > release_notes.md << EOF
          ## WPS Office KR ${{ github.repository }}
          
          **Version:** ${VERSION}
          **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Commit:** ${{ github.sha }}
          
          ### Changes
          - Updated to upstream WPS Office ${VERSION}
          - Korean locale (ko_KR) with default date format: yyyy-MM-dd
          - MIME type protection (prevents .docx/.xlsx/.pptx override)
          - Improved font rendering (Liberation/Carlito metric-compatible)
          - System library integration (libjpeg, libstdc++)
          - PKGBUILD now supports aarch64/arm64 (source_aarch64) for future ARM builds
          
          ### Packages
          - \`wps-office-kr\` (x86_64 / x64): Main package with all patches
          - \`wps-office-kr-mime\` (any): MIME type definitions
          - \`wps-office-kr-fonts\` (any): WPS provided fonts
          - \`wps-office-kr_${VERSION}_amd64.deb\` (amd64/x64): Debian/Ubuntu
          - \`wps-office-kr-${VERSION}-1.x86_64.rpm\` (x86_64 / x64): Fedora/RHEL
          - \`aarch64/arm64\`: PKGBUILD ready, CI arm64 build queued via ubuntu-24.04-arm runner (qemu fallback)
          
          ### SHA256 (source deb)
          \`\`\`
          ${SHA256}
          \`\`\`
          
          ### Installation (Arch Linux - x86_64 / x64)
          \`\`\`bash
          # Using pacman (after adding to local repo)
          sudo pacman -U wps-office-kr-${VERSION}-1-x86_64.pkg.tar.zst
          sudo pacman -U wps-office-kr-mime-${VERSION}-1-any.pkg.tar.zst
          sudo pacman -U wps-office-kr-fonts-${VERSION}-1-any.pkg.tar.zst
          
          # Or with makepkg
          git clone https://github.com/${{ github.repository }}.git
          cd wps-office-kr
          makepkg -si
          \`\`\`
          
          ### Installation (Debian/Ubuntu - amd64)
          \`\`\`bash
          sudo dpkg -i wps-office-kr_${VERSION}_amd64.deb
          sudo apt-get install -f
          \`\`\`
          
          ### Installation (Fedora/RHEL - x86_64 / x64)
          \`\`\`bash
          sudo rpm -i wps-office-kr-${VERSION}-1.x86_64.rpm
          # or
          sudo dnf install wps-office-kr-${VERSION}-1.x86_64.rpm
          \`\`\`
          
          ### Configuration
          After installation, the following are automatically configured:
          - Default locale: ko_KR.UTF-8
          - Default date format in Spreadsheet: yyyy-MM-dd
          - MIME detection disabled at startup
          - Font substitution: Arial→Liberation Sans, Calibri→Carlito, etc.
          EOF
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wps-office-kr-packages
          path: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            wps-office-kr_*.deb
            wps-office-kr-*.rpm
            wps-office-kr_*.rpm
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [check-version, build]
    if: (needs.check-version.outputs.changed == 'true' || needs.check-version.outputs.translation_updated == 'true') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wps-office-kr-packages
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: WPS Office KR ${{ needs.check-version.outputs.version }}
          body_path: ${{ needs.build.outputs.package_info_release_notes }}
          files: |
            dist/*.pkg.tar.zst
            dist/wps-office-kr_*.deb
            dist/wps-office-kr-*.rpm
            dist/wps-office-kr_*.rpm
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD in repo (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # The PKGBUILD was already updated during build
          # Commit and push if there are changes
          if ! git diff --quiet PKGBUILD; then
            git add PKGBUILD
            git commit -m "chore: update to version ${{ needs.check-version.outputs.version }} [skip ci]"
            git push
          fi

  notify:
    name: Notify on Failure
    needs: [check-version, build, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed for version ${{ needs.check-version.outputs.version }}"
          echo "Check workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        shell: bash