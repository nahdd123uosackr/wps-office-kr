name: AUR Deploy

# 이미 빌드된 패키지(GitHub Releases의 *.pkg.tar.zst)를 AUR에 배포한다.
# 배포 조건
#   1) 릴리스 버전(pkgver)이 AUR 현재 버전과 다를 때  → pkgrel=1
#   2) 버전은 같지만 릴리스 자산 내용(sha256)이 바뀌었을 때 → pkgrel+1 (재빌드 동기화)
#   3) 강제 배포: Actions → AUR Deploy → Run workflow (force=true)
# - 패치/번역만 바뀐 커밋은 배포하지 않는다
# - sha256 은 GitHub API 의 asset digest 를 사용 (대용량 다운로드 없음)

on:
  workflow_run:
    workflows: ["WPS Office KR Build & Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: '버전/체크섬이 같아도 강제로 AUR에 배포'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: aur-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PKGBASE: wps-office-kr-bin
      AUR_DIR: aur/wps-office-kr-bin
      GH_REPO: nahdd123uosackr/wps-office-kr
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_KEY: /root/.ssh/aur_ci
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git curl jq openssh python

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || 'main' }}
          fetch-depth: 0

      - name: Prepare tools
        run: |
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name  "nahdd123"
          git config --global user.email "nahdd123@gmail.com"

      - name: Resolve release version and gate
        id: gate
        run: |
          set -euo pipefail
          rel_json=$(curl -fsSL --retry 3 "https://api.github.com/repos/${GH_REPO}/releases/latest")
          tag=$(jq -r '.tag_name' <<<"$rel_json")
          rel_ver=${tag#v}

          names=(
            "wps-office-kr-${rel_ver}-1-x86_64.pkg.tar.zst"
            "wps-office-kr-mime-${rel_ver}-1-any.pkg.tar.zst"
            "wps-office-kr-fonts-${rel_ver}-1-any.pkg.tar.zst"
          )
          sums=()
          for n in "${names[@]}"; do
            d=$(jq -r --arg n "$n" '.assets[] | select(.name == $n) | .digest // empty' <<<"$rel_json")
            if [[ -z ${d} ]]; then
              echo "::error::릴리스 자산이 없습니다: $n"
              exit 1
            fi
            sums+=("${d#sha256:}")
          done

          # AUR PKGBUILD 는 cgit 에서 즉시 조회 (RPC 인덱스 지연 회피)
          aur_pkgbuild=$(curl -fsSL --retry 3 \
            "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=${PKGBASE}" || true)
          aur_ver=$(grep -oP '^pkgver=\K.*' <<<"$aur_pkgbuild" | head -1 || true)
          aur_rel=$(grep -oP '^pkgrel=\K.*' <<<"$aur_pkgbuild" | head -1 || true)
          mapfile -t aur_sums < <(grep -oE "'[0-9a-f]{64}'" <<<"$aur_pkgbuild" | tr -d "'" || true)

          echo "release=${rel_ver} | aur=${aur_ver:-<none>}-${aur_rel:-?}"

          deploy=0
          pkgrel=1
          if [[ -z ${aur_ver} ]]; then
            echo "AUR에 패키지 없음 → 최초 배포"
            deploy=1
          elif [[ ${aur_ver} != "${rel_ver}" ]]; then
            echo "버전 변경: ${aur_ver} -> ${rel_ver} → 배포 (pkgrel=1)"
            deploy=1
          elif [[ "${aur_sums[*]}" != "${sums[*]}" ]]; then
            pkgrel=$(( ${aur_rel:-1} + 1 ))
            echo "버전 동일하지만 자산 내용 변경 → 재배포 (pkgrel=${pkgrel})"
            deploy=1
          elif [[ "${{ inputs.force }}" == "true" ]]; then
            pkgrel=$(( ${aur_rel:-1} + 1 ))
            echo "강제 배포 요청 (pkgrel=${pkgrel})"
            deploy=1
          else
            echo "버전/체크섬 동일 → 배포 건너뜀"
          fi

          {
            echo "deploy=${deploy}"
            echo "pkgrel=${pkgrel}"
            echo "version=${rel_ver}"
            echo "tag=${tag}"
            echo "sums=${sums[*]}"
          } >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD (pkgver/pkgrel/sha256) and .SRCINFO
        if: steps.gate.outputs.deploy == '1'
        run: |
          set -euo pipefail
          read -r -a sums <<< "${{ steps.gate.outputs.sums }}"
          python3 scripts/update-aur-pkgbuild.py \
            aur/wps-office-kr-bin/PKGBUILD \
            "${{ steps.gate.outputs.version }}" "${{ steps.gate.outputs.pkgrel }}" "${sums[@]}"

          # install 파일 참조를 위해 디렉터리를 그대로 복사해 .SRCINFO 생성
          rm -rf /tmp/srcgen && mkdir -p /tmp/srcgen
          cp -a aur/wps-office-kr-bin/. /tmp/srcgen/
          chown -R builder:builder /tmp/srcgen
          su -s /bin/bash builder -c 'cd /tmp/srcgen && makepkg --printsrcinfo' > aur/wps-office-kr-bin/.SRCINFO
          grep -E 'pkgver = |pkgrel = |sha256sums = ' aur/wps-office-kr-bin/.SRCINFO | head -5 || true

      - name: Push to AUR
        if: steps.gate.outputs.deploy == '1'
        run: |
          set -euo pipefail
          if [[ -z ${AUR_SSH_PRIVATE_KEY:-} ]]; then
            echo "::error::secret AUR_SSH_PRIVATE_KEY 가 설정되지 않았습니다" >&2
            exit 1
          fi
          install -d -m700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_KEY"
          chmod 600 "$AUR_KEY"
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $AUR_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          aur_repo=/tmp/aur-repo
          rm -rf "$aur_repo"
          if ! git clone --quiet "ssh://aur@aur.archlinux.org/${PKGBASE}.git" "$aur_repo" 2>/dev/null; then
            echo "신규 패키지: 빈 저장소 초기화"
            mkdir -p "$aur_repo"
            git -C "$aur_repo" init -q -b master
            git -C "$aur_repo" remote add origin "ssh://aur@aur.archlinux.org/${PKGBASE}.git"
          fi

          # AUR은 하위 디렉터리를 허용하지 않으므로 평면 파일만 복사
          cp "${AUR_DIR}/PKGBUILD" "${AUR_DIR}/.SRCINFO" "${AUR_DIR}/wps-office-kr-bin.install" "$aur_repo/"

          git -C "$aur_repo" add -A
          if git -C "$aur_repo" diff --cached --quiet; then
            echo "AUR 내용 변경 없음"
          else
            git -C "$aur_repo" commit -q -m "upgpkg: ${PKGBASE} ${{ steps.gate.outputs.version }}-${{ steps.gate.outputs.pkgrel }}"
            git -C "$aur_repo" push -q origin master
            echo "AUR push 완료: ${{ steps.gate.outputs.version }}-${{ steps.gate.outputs.pkgrel }}"
          fi
          rm -f "$AUR_KEY"

      - name: Commit updated PKGBUILD to repo
        if: steps.gate.outputs.deploy == '1'
        run: |
          set -euo pipefail
          git add aur/wps-office-kr-bin/PKGBUILD aur/wps-office-kr-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo "레포 변경 없음"
          else
            git commit -q -m "aur: wps-office-kr-bin ${{ steps.gate.outputs.version }}-${{ steps.gate.outputs.pkgrel }}"
            git push
          fi

      - name: Report failure
        if: failure()
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"AUR 배포 실패: $(date -u +%F)\",\"body\":\"로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            > /dev/null || echo "이슈 생성 실패 (무시)"
