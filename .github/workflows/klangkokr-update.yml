name: KLANGKOKR Daily Update

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 15:00 UTC = KST 자정 (00:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-klangkokr:
    name: Check KLANGKOKR New Version
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check current klangkokr version
        id: check
        run: |
          CURRENT_VERSION="unknown"
          if [[ -f "wps_한글_패치/ko_KR/CREDITS" ]]; then
            CURRENT_VERSION=$(grep -o "3\.[0-9]\+\.[0-9]\+" wps_한글_패치/ko_KR/CREDITS 2>/dev/null | head -1 || echo "3.1.0.399")
          elif [[ -f "klangkokr/CREDITS" ]]; then
            CURRENT_VERSION=$(grep -o "3\.[0-9]\+\.[0-9]\+" klangkokr/CREDITS 2>/dev/null | head -1 || echo "$CURRENT_VERSION")
          fi
          echo "Current klangkokr: $CURRENT_VERSION"
          DICT_SIZE=$(jq 'length' translation_dict.json 2>/dev/null || echo 0)
          echo "Current dict size: $DICT_SIZE"
          # Check for new WPS Windows version that might have new klangkokr
          LATEST_WPS=$(curl -s "https://www.wps.com/office/windows" 2>/dev/null | grep -o "12\.[0-9][0-9]*\.[0-9]*\.[0-9]*" | head -1 || echo "")
          echo "Latest WPS Windows: $LATEST_WPS"
          # For CI, we use wps_한글_패치 as primary source; if it was updated locally, this will detect
          NEED_UPDATE="false"
          NEW_VERSION="$CURRENT_VERSION"
          # Check git history for recent translation changes
          if git log --since="24 hours ago" --name-only --pretty=format: 2>/dev/null | grep -qE "wps_한글_패치|klangkokr|translation_dict"; then
            NEED_UPDATE="true"
            echo "Recent local klangkokr change detected"
          fi
          # Also check if dict size < 176 (previous complete)
          if [[ "$DICT_SIZE" -lt 176 ]]; then
            NEED_UPDATE="true"
            NEW_VERSION="3.1.0.399+dictfix"
          fi
          echo "updated=$NEED_UPDATE" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Need update: $NEED_UPDATE"

      - name: Install Wine and extract KLANGKOKR - Arch install_wine_and_extract_kokr.sh
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "=== Installing Wine and WPS for KLANGKOKR extraction (Arch base) ==="
          # Arch: pacman -S wine xorg-server-xvfb xdotool / Debian: apt
          if command -v pacman >/dev/null 2>&1; then
            sudo pacman -Syu --noconfirm 2>&1 | tail -n 5
            sudo pacman -S --noconfirm --needed wine xorg-server-xvfb xdotool p7zip 2>&1 | tail -n 20 || true
          else
            sudo apt-get update -qq 2>&1 | tail -n 5
            sudo apt-get install -y -qq wine64 xvfb xdotool p7zip-full 7zip 2>&1 | tail -n 20 || sudo apt-get install -y wine xvfb xdotool p7zip-full 2>&1 | tail -n 20 || true
          fi
          wine --version 2>&1 | head; Xvfb -help 2>&1 | head -n 5 || true; xdotool --version 2>&1 | head || true
          # Prepare installer: prefer dynamic from wps.com (600.1002) or APKPure offline
          if [[ ! -f "/home/corp/다운로드/wps_wid.cid-549782062.1783900409.exe" ]]; then
            echo "--- Preparing Windows installer (dynamic from wps.com) ---"
            mkdir -p "/home/corp/다운로드" 2>/dev/null || mkdir -p "$HOME/다운로드" 2>/dev/null || true
            # Use get_wps_windows.sh to download offline (254M) if not in CI cache
            if [[ -x "scripts/get_wps_windows.sh" ]]; then
              bash scripts/get_wps_windows.sh /tmp/wps_win.exe 2>&1 | tail -n 20 || true
              if [[ -f /tmp/wps_win.exe ]]; then
                mkdir -p "/home/corp/다운로드" 2>/dev/null || true
                cp -a /tmp/wps_win.exe "/home/corp/다운로드/wps_wid.cid-549782062.1783900409.exe" 2>/dev/null || cp -a /tmp/wps_win.exe "$HOME/다운로드/wps_wid.cid-549782062.1783900409.exe" 2>/dev/null || true
              fi
            fi
          fi
          ls -lh "/home/corp/다운로드/wps_wid.cid-549782062.1783900409.exe" 2>&1 | head || ls -lh "$HOME/다운로드/wps_wid.cid-549782062.1783900409.exe" 2>&1 | head || echo "Installer not yet in corp path (CI will use wps_한글_패치)"
          # Run Arch-based extractor: install_wine_and_extract_kokr.sh (Xvfb :77, wineboot, xdotool 308,621 etc)
          if [[ -x "install_wine_and_extract_kokr.sh" ]]; then
            echo "--- Running install_wine_and_extract_kokr.sh (Arch: wine + Xvfb + xdotool) ---"
            # In CI (ubuntu, no display), we run with timeout 120 and allow failure, fallback to wps_한글_패치
            timeout 300 bash install_wine_and_extract_kokr.sh 2>&1 | tail -n 100 || echo "Wine install timed out or failed (expected in CI without full GUI), fallback to wps_한글_패치"
            # Check result: WINEPREFIX $HOME/.wine-wps-kokr
            ls -lh "$HOME/.wine-wps-kokr/drive_c/users/$USER/AppData/Roaming/kingsoft/wps_intl/addons/pool/win-x64/klangkokr_"* 2>&1 | head -n 20 || ls -lh "$HOME/wps_kokr_extracted" 2>&1 | head -n 20 || echo "Pool not yet, using committed wps_한글_패치"
          fi
          if [[ -f "apply_wps_kokr_langpack.sh" ]]; then
            echo "--- apply_wps_kokr_langpack.sh would merge pool -> /usr/lib/office6 (live system) ---"
            echo "CI: PKGBUILD handles same via wps_한글_패치 copy to pkgdir/usr/lib/office6/mui/ko_KR"
          fi
          ls -lh wps_한글_패치/ko_KR/*.qm 2>&1 | head -n 10
          echo "wps_한글_패치 ready for PKGBUILD (fallback human translation)"

      - name: Extract KLANGKOKR qm to wps_한글_패치
        if: steps.check.outputs.updated == 'true'
        shell: bash
        run: |
          echo "=== Extracting KLANGKOKR qm to wps_한글_패치 ==="
          shopt -s nullglob
          # 1) Try wine pool (local with Wine) - latest klangkokr_*/ko_KR
          POOL_SRC=""
          for base in "$HOME/.wine-wps-kokr" "$HOME/.wine" "$HOME/.wine-wps"; do
            for p in "$base"/drive_c/users/*/AppData/Roaming/kingsoft/wps_intl/addons/pool/win-x64/klangkokr_*/ko_KR; do
              [[ -d "$p" ]] && POOL_SRC="$p" && break 2
            done
          done
          shopt -u nullglob
          if [[ -n "$POOL_SRC" && -d "$POOL_SRC" ]]; then
            echo "Found pool: $POOL_SRC ($(find "$POOL_SRC" -name "*.qm" | wc -l) qm)"
            mkdir -p wps_한글_패치/ko_KR
            cp -a "$POOL_SRC"/*.qm wps_한글_패치/ko_KR/ 2>/dev/null || true
            cp -a "$POOL_SRC"/../*.qm wps_한글_패치/ 2>/dev/null || true
            cp -a "$POOL_SRC"/lang.conf wps_한글_패치/ko_KR/ 2>/dev/null || true
            cp -a "$POOL_SRC"/ko_KR.png wps_한글_패치/ko_KR/ 2>/dev/null || true
            # Also handle addons wps-i18n
            find "$POOL_SRC/.." -type d -path "*/wps-i18n/ko-kr" 2>/dev/null | while read -r d; do
              rel="${d#"$POOL_SRC/.."}"
              mkdir -p "wps_한글_패치/$rel"
              cp -a "$d"/* "wps_한글_패치/$rel/" 2>/dev/null || true
            done
            echo "Pool -> wps_한글_패치 done: $(ls wps_한글_패치/ko_KR/*.qm | wc -l) qm"
          else
            echo "No pool found (CI), using committed wps_한글_패치 as source"
            ls -lh wps_한글_패치/ko_KR/*.qm 2>&1 | head -n 5
          fi
          # Also ensure wps_한글_패치 is available for PKGBUILD
          ls -lh wps_한글_패치/ko_KR/ 2>&1 | head -n 20

      - name: Build 한글 번역 테이블 (translation_dict.json) from KLANGKOKR
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "=== Building 한글 번역 테이블 from KLANGKOKR qm ==="
          python3 << 'PYEOF'
          import subprocess, json, pathlib, tempfile, xml.etree.ElementTree as ET, os
          
          patch_dir = "wps_한글_패치/ko_KR"
          dict_path = "translation_dict.json"
          
          with open(dict_path, 'r', encoding='utf-8') as f:
              d = json.load(f)
          print(f"Before: {len(d)}")
          orig = len(d)
          
          # Extract from patch qm (core)
          for qm_path in pathlib.Path(patch_dir).glob("*.qm"):
              with tempfile.NamedTemporaryFile(suffix='.ts', delete=False) as tmp:
                  tmp_path = tmp.name
              try:
                  r = subprocess.run(['lconvert', '-i', str(qm_path), '-o', tmp_path], capture_output=True)
                  if r.returncode != 0:
                      continue
                  tree = ET.parse(tmp_path)
                  for ctx in tree.getroot().findall('context'):
                      for msg in ctx.findall('message'):
                          src = msg.find('source')
                          tr = msg.find('translation')
                          st = src.text.strip() if src is not None and src.text and src.text.strip() else ""
                          tt = tr.text.strip() if tr is not None and tr.text and tr.text.strip() else ""
                          if st and tt and any('\uAC00' <= c <= '\uD7A3' for c in tt) and st != tt:
                              if st not in d:
                                  d[st] = tt
              finally:
                  try:
                      os.unlink(tmp_path)
                  except:
                      pass
          
          # Also handle wps_한글_패치 addons if any (future)
          patch_addons = pathlib.Path(patch_dir).parent / "addons"
          if patch_addons.exists():
              for qm_path in patch_addons.rglob("ko_KR/*.qm"):
                  with tempfile.NamedTemporaryFile(suffix='.ts', delete=False) as tmp:
                      tmp_path = tmp.name
                  try:
                      r = subprocess.run(['lconvert', '-i', str(qm_path), '-o', tmp_path], capture_output=True)
                      if r.returncode != 0:
                          continue
                      tree = ET.parse(tmp_path)
                      for ctx in tree.getroot().findall('context'):
                          for msg in ctx.findall('message'):
                              src = msg.find('source')
                              tr = msg.find('translation')
                              st = src.text.strip() if src is not None and src.text and src.text.strip() else ""
                              tt = tr.text.strip() if tr is not None and tr.text and tr.text.strip() else ""
                              if st and tt and any('\uAC00' <= c <= '\uD7A3' for c in tt) and st != tt:
                                  if st not in d:
                                      d[st] = tt
                  finally:
                      try:
                          os.unlink(tmp_path)
                      except:
                          pass
          
          # Ensure win_translations coverage
          win_tar = "win_translations.tar.gz"
          win_dir = None
          if os.path.exists(win_tar):
              import tarfile, glob
              tmpdir = tempfile.mkdtemp()
              with tarfile.open(win_tar) as tar:
                  tar.extractall(tmpdir)
              for p in pathlib.Path(tmpdir).rglob("*.ts"):
                  win_dir = str(p.parent)
                  break
              if win_dir:
                  win_english = set()
                  for ts in pathlib.Path(win_dir).glob("*.ts"):
                      try:
                          tree = ET.parse(str(ts))
                          for ctx in tree.getroot().findall('context'):
                              for msg in ctx.findall('message'):
                                  src = msg.find('source')
                                  tr = msg.find('translation')
                                  eng = ""
                                  if src is not None and src.text and src.text.strip():
                                      eng = src.text.strip()
                                  elif tr is not None and tr.text and tr.text.strip():
                                      txt = tr.text.strip()
                                      if any('\uAC00' <= c <= '\uD7A3' for c in txt):
                                          continue
                                      eng = txt
                                  if eng and not any('\uAC00' <= c <= '\uD7A3' for c in eng):
                                      win_english.add(eng)
                      except:
                          pass
                  uncovered = [e for e in win_english if e not in d]
                  print(f"Win uncovered: {len(uncovered)}")
                  for k in uncovered:
                      if k not in d:
                          d[k] = k
          
          print(f"After: {len(d)} (+{len(d)-orig})")
          with open(dict_path, 'w', encoding='utf-8') as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
          print(f"Final dict {len(d)}")
          PYEOF
          
          echo "=== Dict built ==="
          echo "New dict size: $(jq 'length' translation_dict.json)"

      - name: Commit and push if updated
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation_dict.json wps_한글_패치/ 2>/dev/null || true
          git add klangkokr/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: klangkokr daily update - $(date -u +%Y-%m-%d) [skip ci]"
            git push
            echo "Pushed klangkokr update"
          else
            echo "No changes to commit"
          fi
